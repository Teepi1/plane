[package]
name = "plane-gui"
version = "0.1.0"
edition = "2021"
description = "Plane as a native GTK app: the sidebar beside tabs of built-in terminals"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
vte = { package = "vte4", version = "0.10", features = ["v0_76"] }
sourceview5 = { version = "0.11", features = ["v5_10", "gtk_v4_14"] }
serde_json = "1"
plane-core = { path = "../plane-core" }
